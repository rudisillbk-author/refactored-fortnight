<head>

<style>
  :root{ --ink:#1A1420; --paper:#F1E6D9; --paper-dim:#D3C4CC; --ember:#9C2F5C; --ember-bright:#C2447A; --amber:#CBA05E; --radius:3px;
    --serif:'Fraunces',Georgia,serif; --sans:'Archivo',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
    background:var(--ink); color:var(--paper); font-family:var(--sans); text-align:center; line-height:1.55; }
  main{ max-width:460px; }
  h1{ font-family:var(--serif); font-weight:300; font-size:clamp(2rem,6vw,2.6rem); line-height:1.1; margin:0 0 16px; }
  h1 em{ font-weight:600; }
  p{ color:var(--paper-dim); margin:0 0 26px; }
  .btn{ display:inline-block; padding:14px 26px; border-radius:var(--radius); background:var(--ember); color:var(--paper);
    font-weight:600; text-decoration:none; }
  .btn:hover{ background:var(--ember-bright); }
</style>
</head>
<body>
<main>
  <h1>Your bonus scene is <em>on its way.</em></h1>
  <p>Taking you to the sign-up page now. If nothing happens, use the button below.</p>
